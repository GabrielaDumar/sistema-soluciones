<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - MLS</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #4a6fa5;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4a6fa5;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #3b5c8c;
        }

        .login-link {
            text-align: center;
            margin-top: 15px;
        }

        .login-link a {
            text-decoration: none;
            color: #4a6fa5;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Crear Cuenta</h2>

    <form th:action="@{/registro}" method="post">

        <input type="text" name="nomUsu" placeholder="Nombre" required>

        <input type="text" name="apeUsu" placeholder="Apellido" required>

        <input type="email" name="correoUsu" placeholder="Correo" required>

        <input type="password" name="contUsu" placeholder="Contraseña" required>

        <button type="submit">Registrarse</button>

    </form>

    <div class="login-link">
        ¿Ya tienes cuenta?
        <a th:href="@{/}">Iniciar sesión</a>
    </div>
</div>

</body>
</html>
